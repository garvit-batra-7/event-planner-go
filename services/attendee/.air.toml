root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  delay = 1000            # ms debounce between builds
  stop_on_error = true    # don't keep old binary running on build errors
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[screen]
  clear = true

[watcher]
  # Watch only attendee service + shared package used by all services
  include = [
    "cmd/**/*.go",                 # attendee HTTP entrypoint
    "internal/**/*.go",            # attendee service code
    "../../pkg/shared/**/*.go",    # shared middleware, logging, etc.
  ]
  exclude = [
    "tmp",
    "vendor",
  ]
